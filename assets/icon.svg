<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3350"/>
      <stop offset="0.55" stop-color="#1b2033"/>
      <stop offset="1" stop-color="#0f121b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="float" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6bff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05070f" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="117" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- dot grid -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="64" cy="64" r="3"/><circle cx="128" cy="64" r="3"/><circle cx="192" cy="64" r="3"/>
    <circle cx="64" cy="448" r="3"/><circle cx="128" cy="448" r="3"/><circle cx="192" cy="448" r="3"/>
  </g>
  <!-- back cards -->
  <g>
    <rect x="70" y="86" width="168" height="120" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="100" cy="116" r="12" fill="#63b3ff"/>
    <rect x="96" y="146" width="96" height="12" rx="6" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="96" y="168" width="64" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>

    <rect x="274" y="86" width="168" height="120" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="304" cy="116" r="12" fill="#ffc95c"/>
    <rect x="300" y="146" width="96" height="12" rx="6" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="300" y="168" width="52" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>

    <rect x="70" y="230" width="168" height="120" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="100" cy="260" r="12" fill="#5fe0a6"/>
    <rect x="96" y="290" width="88" height="12" rx="6" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="96" y="312" width="60" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
  </g>
  <!-- floating front card -->
  <g filter="url(#sh)" transform="rotate(-4 344 300)">
    <rect x="246" y="228" width="200" height="152" rx="28" fill="url(#float)"/>
    <rect x="246" y="228" width="200" height="152" rx="28" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="280" cy="264" r="11" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="276" y="292" width="128" height="14" rx="7" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="276" y="316" width="96" height="11" rx="6" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="276" y="338" width="140" height="11" rx="6" fill="#ffffff" fill-opacity="0.35"/>
  </g>
</svg>
